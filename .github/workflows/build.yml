name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时用于发布 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Python + tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --name NetTester --icon assets/icon.ico --add-data "assets;assets" net_tester.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --onefile --windowed --name NetTester --icon assets/icon.icns --add-data "assets:assets" net_tester.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --windowed --name NetTester --add-data "assets:assets" net_tester.py

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r NetTester-macOS.zip NetTester.app && rm -rf NetTester.app NetTester

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTester-${{ runner.os }}
          path: dist/

  release:
    # 单独一个 job 发布，避免三个构建并发创建 Release 互相冲突
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
