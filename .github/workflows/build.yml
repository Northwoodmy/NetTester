name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时用于发布 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Python + tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: python -m PyInstaller --onefile --windowed --name NetTester net_tester.py

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: cd dist && zip -r NetTester-macOS.zip NetTester.app && rm -rf NetTester.app NetTester

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetTester-${{ runner.os }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
